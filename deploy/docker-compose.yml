# Contabo VPS üzerinde: backend + Caddy (otomatik HTTPS).
# Kullanım (sunucuda, /opt/astrype/backend içinde):
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build: ..
    env_file: /opt/astrype/backend.env   # gizli değerler; repoda değil
    restart: unless-stopped
    expose:
      - "8000"
    # Yalnız sunucunun içinden erişim (bakım/test); dışarıya Caddy açar.
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Host ağı: hem API'ye (127.0.0.1:8000) hem web sitesine (127.0.0.1:3002,
    # Docker dışında çalışır) ulaşsın. 80/443'ü doğrudan dinler.
    network_mode: host
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.astrype.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
